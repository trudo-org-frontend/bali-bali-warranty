<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bali Bali — Coming Soon</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet"
    />
    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
        }

        body {
            display: flex;
            min-height: 100vh;
            width: 100%;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            background-color: #ffffff;
            padding: 0 1rem;
            font-family: 'Inter', sans-serif;
        }

        /* Navbar */
        .navbar-wrapper {
            position: fixed;
            top: 1rem;
            left: 50%;
            z-index: 50;
            transform: translateX(-50%);
        }

        .toolbar {
            display: flex;
            flex-direction: column;
            width: max(320px, 41.7vw);
            max-width: calc(100% - 32px);
            border-radius: max(8px, 0.6vw);
            border: 0;
            background-color: #d8d7d7d9;
            -webkit-backdrop-filter: blur(19.4px);
            backdrop-filter: blur(19.4px);
            overflow: hidden;
        }

        .toolbar-header {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            height: max(64px, 4.4vw);
            padding: max(8px, 0.6vw) max(16px, 1.1vw);
        }

        .toolbar-end {
            display: flex;
            align-items: center;
            gap: max(12px, 0.8vw);
        }

        .icon-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            height: max(28px, 1.9vw);
            width: max(28px, 1.9vw);
            border-radius: 50%;
            border: none;
            background: transparent;
            color: #000000;
            cursor: pointer;
            padding: 0;
            text-decoration: none;
        }

        .icon-btn svg {
            height: max(22px, 1.5vw);
            width: max(22px, 1.5vw);
        }

        .icon-btn .icon-close {
            display: none;
        }

        /* Pure CSS checkbox-driven toggle — no JS required to open/close */
        .menu-toggle-checkbox {
            position: absolute;
            width: 1px;
            height: 1px;
            overflow: hidden;
            clip: rect(0 0 0 0);
            white-space: nowrap;
        }

        .menu-overlay {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 40;
            cursor: default;
        }

        #menuToggle:checked ~ .menu-overlay {
            display: block;
        }

        #menuToggle:checked ~ .navbar-wrapper .icon-bars {
            display: none;
        }

        #menuToggle:checked ~ .navbar-wrapper .icon-close {
            display: block;
        }

        #menuToggle:checked ~ .navbar-wrapper .menu-content {
            display: flex;
        }

        .brand-logo {
            position: absolute;
            left: 50%;
            top: 50%;
            height: max(32px, 2.2vw);
            width: max(32px, 2.2vw);
            transform: translate(-50%, -50%);
            object-fit: contain;
        }

        /* Dropdown menu */
        .menu-content {
            display: none;
            flex-direction: column;
            padding: max(4px, 0.3vw) max(16px, 1.1vw) max(16px, 1.1vw);
            border-top: 1px solid rgba(0, 0, 0, 0.12);
        }

        .menu-content.open {
            display: flex;
        }

        .menu-item {
            display: block;
            width: 100%;
            text-align: left;
            background: transparent;
            border: none;
            border-radius: max(8px, 0.6vw);
            padding: max(10px, 0.7vw) max(12px, 0.8vw);
            margin-top: max(4px, 0.3vw);
            font-family: 'Inter', sans-serif;
            font-size: max(14px, 0.95vw);
            font-weight: 400;
            color: #000000;
            text-decoration: none;
            cursor: pointer;
            transition: background-color 0.15s ease;
        }

        .menu-item:hover,
        .menu-item:focus-visible {
            background-color: rgba(0, 0, 0, 0.08);
            outline: none;
        }

        .menu-item.selected {
            font-weight: 600;
            background-color: transparent;
        }

        /* Coming soon content */
        .brand-name {
            height: auto;
            width: 100%;
            max-width: 400px;
        }

        .coming-soon-text {
            font-family: 'Inter', sans-serif;
            font-size: 32px;
            font-weight: 400;
            color: #000000;
            margin: 0;
        }
    </style>
</head>
<body>
    <input type="checkbox" id="menuToggle" class="menu-toggle-checkbox" aria-hidden="true" />
    <label for="menuToggle" class="menu-overlay" aria-hidden="true"></label>

    <div class="navbar-wrapper" id="navbarWrapper">
        <div class="toolbar">
            <div class="toolbar-header">
                <label for="menuToggle" class="icon-btn menu-toggle" aria-label="Toggle menu">
                    <svg class="icon-bars" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                        <path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                    </svg>
                    <svg class="icon-close" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                        <path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                    </svg>
                </label>

                <img src="assets/images/brand-knot-logo.png" alt="Brand" class="brand-logo" />

                <div class="toolbar-end">
                    <a href="/auth/login" class="icon-btn" aria-label="Account">
                        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                            <path
                                d="M12 12a4.5 4.5 0 1 0 0-9 4.5 4.5 0 0 0 0 9Z"
                                stroke="currentColor"
                                stroke-width="2"
                            />
                            <path
                                d="M4 20.5c0-3.6 3.58-6.5 8-6.5s8 2.9 8 6.5"
                                stroke="currentColor"
                                stroke-width="2"
                                stroke-linecap="round"
                            />
                        </svg>
                    </a>
                    <a href="/order/review" class="icon-btn" aria-label="Cart">
                        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                            <path
                                d="M3 4h2l2.4 12.2a2 2 0 0 0 2 1.6h7.6a2 2 0 0 0 2-1.6L21 8H6"
                                stroke="currentColor"
                                stroke-width="2"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                            />
                            <circle cx="9.5" cy="21" r="1.5" fill="currentColor" />
                            <circle cx="17.5" cy="21" r="1.5" fill="currentColor" />
                        </svg>
                    </a>
                </div>
            </div>

            <nav class="menu-content" id="menuContent" aria-label="Main menu">
                <a href="/warranty" class="menu-item" data-menu-link>Warranty</a>
            </nav>
        </div>
    </div>

    <img src="assets/images/bali-bali-name.png" alt="Bali Bali" class="brand-name" />
    <p class="coming-soon-text">Coming Soon</p>

    <script>
        // Progressive enhancement only — the menu itself opens/closes via the
        // #menuToggle checkbox in pure CSS, so it keeps working even if this
        // script is blocked (e.g. sandboxed previews). This just adds a brief
        // "selected" flash and closes the menu before navigating.
        var menuCheckbox = document.getElementById('menuToggle');

        document.addEventListener('keydown', function (event) {
            if (event.key === 'Escape' && menuCheckbox.checked) {
                menuCheckbox.checked = false;
            }
        });

        document.querySelectorAll('[data-menu-link]').forEach(function (link) {
            link.addEventListener('click', function (event) {
                event.preventDefault();
                document.querySelectorAll('.menu-item').forEach(function (item) {
                    item.classList.remove('selected');
                });
                link.classList.add('selected');
                var destination = link.getAttribute('href');
                window.setTimeout(function () {
                    window.location.href = destination;
                }, 150);
            });
        });
    </script>
</body>
</html>
